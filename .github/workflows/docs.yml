# Build the vilan book INTO this site at /docs/ (road-to-launch P2; the
# user's call: docs live at vilan-lang.org/docs/). This repo owns the build
# so no cross-repo credential exists: it checks out the public toolchain
# repo, builds the book, and commits the result to itself.
#
# Freshness: the vilan cut flow dispatches this workflow after pushing main
# (gh workflow run docs.yml -R vilan-lang/vilan-lang.github.io); the daily
# schedule is the safety net for anything missed. A push that changes
# chrome/ (the website's deploy publishing a new masthead) rebuilds too, so
# the book never wears yesterday's bar for long.
#
# This workflow writes docs/ and nothing else; the website's deploy.yml
# (vilan-lang/website) writes the root trio, playground/, and chrome/; the
# rest is hand-owned. See the README at the repo root for the map.
name: docs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/docs.yml", "chrome/**"]

permissions:
  contents: write

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vilan-lang/vilan
          ref: main
          path: toolchain
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book into docs/
        run: |
          # The site's masthead (docs-port.md S4, ruling Q2 mechanism (i)):
          # the website's deploy exports the bar it renders for / and
          # /playground/ as chrome/header.html (the <nav>, one root element)
          # plus chrome/header.css, and the book wears it as its header
          # partial - one nav, generated by the site's own code, never
          # hand-copied. Gated on the book's theme shipping a head.hbs (the
          # partial that links /chrome/header.css), so a toolchain whose
          # theme predates the chrome never renders the bar unstyled.
          if [ -f chrome/header.html ] && [ -f toolchain/vilan/docs/theme/head.hbs ]; then
            cp chrome/header.html toolchain/vilan/docs/theme/header.hbs
            echo "::notice::the book wears chrome/header.html as theme/header.hbs"
          fi
          mdbook build toolchain/vilan/docs
          rm -rf docs
          mv toolchain/vilan/docs/book docs
          # book.toml's `src = "."` makes mdBook sweep the config and the
          # theme SOURCES into the output beside the hashed copies the pages
          # actually load (docs-port.md 1.3, N10): book.toml, theme/vilan.js
          # (the pages load theme/vilan-<hash>.js), and the partials. Drop
          # them from the served tree; any further theme source the book
          # grows leaks the same way and belongs on this line.
          rm -f docs/book.toml docs/theme/vilan.js docs/theme/header.hbs docs/theme/head.hbs
          rm -rf toolchain
      - name: Generate the book's sitemap
        # SUMMARY.md decides which pages exist, so the sitemap is generated
        # from what mdBook actually built rather than kept by hand. Left out:
        # print.html and toc.html (both carry mdBook's own noindex) and
        # 404.html (not a page). No lastmod, deliberately: this workflow also
        # runs on a daily cron and commits only when the book changed, and a
        # build-date lastmod would make every single run a change.
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find docs -name '*.html' \
              ! -name print.html ! -name toc.html ! -name 404.html \
              | sed -e 's|^docs/|https://vilan-lang.org/docs/|' \
                    -e 's|/index\.html$|/|' \
              | sort \
              | sed -e 's|.*|  <url><loc>&</loc></url>|'
            echo '</urlset>'
          } > docs/sitemap.xml
          echo "::notice::the book's sitemap lists $(grep -c '<url>' docs/sitemap.xml) pages"
      - name: Commit if the book changed
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "::notice::the book is unchanged"
          else
            git -c user.name="docs-builder" -c user.email="docs@vilan-lang.org" \
              commit -m "docs: rebuild the book from vilan-lang/vilan@main"
            git push
          fi
